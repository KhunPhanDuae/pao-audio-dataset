<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pa'O Smart Voice Engine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 520px;
            margin: 20px auto;
            padding: 20px;
            background: #f4f6f9;
            text-align: center;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #0066ff;
            color: white;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            background: #004bb5;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Pa'O Smart Audio Reader</h2>

        <div class="form-group">
            <label for="text">စာသား ရိုက်ထည့်ပါ:</label>
            <input type="text" id="text" placeholder="စာရိုက်ပါ (ဥပမာ - အွေႏနာꩻ)">
        </div>

        <div class="form-group">
            <label for="audioStyle">အသံ အမျိုးအစား ရွေးပါ:</label>
            <select id="audioStyle">
                <option value="conversational">ပုံမှန် စကားပြောသံ (Conversational)</option>
                <option value="storytelling">ပုံပြင် ပြောသံ (Storytelling)</option>
                <option value="news">သတင်း ဖတ်သံ (News)</option>
            </select>
        </div>

        <button id="playBtn" onclick="playText()">အသံဖတ်ရန်</button>

        <div id="status">အသင့်ဖြစ်ပါပြီ</div>
    </div>

    <script>
        const basePath = "./audio/";
        let audioFiles = [];
        let audioCache = new Map();
        let ctx;

        // metadata.csv ကို ဖတ်ယူပြီး စာသား / ဖိုင်အမည်များကို စာရင်းသွင်းခြင်း
        async function loadMetadata() {
            try {
                let res = await fetch("metadata.csv");
                if (res.ok) {
                    let text = await res.text();
                    let lines = text.split("\n");
                    let files = [];

                    for (let i = 1; i < lines.length; i++) {
                        let cols = lines[i].split(",");
                        if (cols.length >= 2) {
                            let filename = cols[0].trim();
                            let word = filename.replace(/\.[^/.]+$/, "");
                            let transcript = cols[1].trim();

                            if (word) files.push(word);
                            if (transcript) files.push(transcript);
                        }
                    }

                    // Duplicates ဖယ်ထုတ်ပြီး အရှည်ဆုံး စကားလုံးများ အရင်လာအောင် Sort စီမည်
                    audioFiles = [...new Set(files)].sort((a, b) => b.length - a.length);
                }
            } catch (e) {
                console.warn("metadata.csv ကို ဖတ်မရပါ၊ မူလ Array ကို သုံးပါမည်:", e);
                // Fallback Array
                audioFiles = ["အွေႏ", "နာꩻ", "ကတူႏ", "နျာႏ", "ထဲင်း", "ခွေ", "လꩻ", "နေ", "ဟောင်း", "နဲ့"].sort((a, b) => b.length - a.length);
            }
        }

        window.addEventListener("DOMContentLoaded", loadMetadata);

        // စာသားကို အရှည်ဆုံး စကားလုံးအလိုက် တိတိကျကျ ခွဲထုတ်ခြင်း
        function smartSplit(text) {
            let result = [];
            while (text.length > 0) {
                let found = "";
                for (let f of audioFiles) {
                    if (text.startsWith(f)) {
                        found = f;
                        break;
                    }
                }

                if (found) {
                    result.push(found);
                    text = text.substring(found.length);
                } else {
                    let char = text[0];
                    result.push(char);
                    text = text.substring(1);
                }
            }
            return result;
        }

        // Web Audio Buffer အဖြစ် ရွေးချယ်ထားသော Style Folder ထဲမှ Load လုပ်မည်
        async function loadAudioBuffer(name, style) {
            const extensions = [".wav", ".mp3", ".m4a", ".ogg"];

            for (let ext of extensions) {
                // audio/<style>/<filename> လမ်းကြောင်းအလိုက် ညွှန်းခြင်း
                let url = `${basePath}${style}/${encodeURIComponent(name)}${ext}`;

                if (audioCache.has(url)) {
                    return audioCache.get(url);
                }

                try {
                    let res = await fetch(url);
                    if (res.ok) {
                        let arrayBuffer = await res.arrayBuffer();
                        let decodedBuffer = await ctx.decodeAudioData(arrayBuffer);
                        audioCache.set(url, decodedBuffer);
                        return decodedBuffer;
                    }
                } catch (e) { }
            }
            return null;
        }

        // အဓိက အသံဖတ်ပြပေးမည့် Function
        async function playText() {
            let text = document.getElementById("text").value.trim();
            let style = document.getElementById("audioStyle").value;
            let status = document.getElementById("status");
            let btn = document.getElementById("playBtn");

            if (!text) return;

            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (ctx.state === "suspended") {
                await ctx.resume();
            }

            btn.disabled = true;
            status.innerText = "အသံဖိုင်များ စီစဉ်နေသည်...";

            let words = smartSplit(text);
            let buffers = [];

            for (let word of words) {
                let buffer = await loadAudioBuffer(word, style);
                if (buffer) {
                    buffers.push(buffer);
                }
            }

            if (buffers.length === 0) {
                status.innerText = "အသံမတွေ့ပါ";
                btn.disabled = false;
                return;
            }

            status.innerText = "ဖွင့်နေသည်...";

            let currentTime = ctx.currentTime;

            buffers.forEach(buffer => {
                let source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);
                source.start(currentTime);

                currentTime += buffer.duration;
            });

            let totalTimeMs = (currentTime - ctx.currentTime) * 1000;
            setTimeout(() => {
                status.innerText = "အသင့်ဖြစ်ပါပြီ";
                btn.disabled = false;
            }, totalTimeMs);
        }
    </script>

</body>

</html>
