<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pa'O Ultra-Seamless Voice Engine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 520px;
            margin: 20px auto;
            padding: 20px;
            background: #f4f6f9;
            text-align: center;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #0066ff;
            color: white;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            background: #004bb5;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Pa'O Smart Audio Reader</h2>

        <div class="form-group">
            <label for="text">စာသား ရိုက်ထည့်ပါ:</label>
            <input type="text" id="text" placeholder="စာရိုက်ပါ (ဥပမာ - ဝွေꩻယိုနောဝ်ꩻ)">
        </div>

        <div class="form-group">
            <label for="audioStyle">အသံ အမျိုးအစား ရွေးပါ:</label>
            <select id="audioStyle">
                <option value="conversational">ပုံမှန် စကားပြောသံ (Conversational)</option>
                <option value="storytelling">ပုံပြင် ပြောသံ (Storytelling)</option>
                <option value="news">သတင်း ဖတ်သံ (News)</option>
            </select>
        </div>

        <button id="playBtn" onclick="playText()">အသံဖတ်ရန်</button>

        <div id="status">အချက်အလက်များ ပြင်ဆင်နေသည်...</div>
    </div>

    <script>
        const basePath = "./audio/";
        
        let textToFilenameMap = new Map();
        let sortedTranscripts = [];
        let audioCache = new Map();
        let ctx = null;

        // ၁။ CSV Indexing
        async function initEngine() {
            try {
                let res = await fetch("metadata.csv");
                if (res.ok) {
                    let text = await res.text();
                    let lines = text.split("\n");

                    for (let i = 1; i < lines.length; i++) {
                        let line = lines[i].trim();
                        if (!line) continue;
                        
                        let cols = line.split(",");
                        if (cols.length >= 2) {
                            let filename = cols[0].trim();
                            let transcript = cols[1].trim();

                            if (filename && transcript) {
                                textToFilenameMap.set(transcript, filename);
                                sortedTranscripts.push(transcript);
                            }
                        }
                    }
                    sortedTranscripts.sort((a, b) => b.length - a.length);
                    document.getElementById("status").innerText = "အသင့်ဖြစ်ပါပြီ";
                }
            } catch (e) {
                console.error("Metadata load error:", e);
                document.getElementById("status").innerText = "အသင့်ဖြစ်ပါပြီ";
            }
        }

        // ၂။ Dynamic Split Strategy
        function smartMatchSplit(text) {
            let rawText = text.replace(/\s+/g, "");
            let tokens = [];

            while (rawText.length > 0) {
                let matched = "";
                for (let t of sortedTranscripts) {
                    if (rawText.startsWith(t)) {
                        matched = t;
                        break;
                    }
                }

                if (matched) {
                    tokens.push(matched);
                    rawText = rawText.substring(matched.length);
                } else {
                    tokens.push(rawText[0]);
                    rawText = rawText.substring(1);
                }
            }
            return tokens;
        }

        // ၃။ အသံဖိုင်မှ Silence (အသံတိတ်ပိုင်း) များကို အလိုအလျောက် ဖြတ်ထုတ်ပေးမည့် Auto-Trimmer
        function trimSilence(buffer, threshold = 0.008) {
            let pcm = buffer.getChannelData(0);
            let start = 0;
            let end = pcm.length - 1;

            // အစပိုင်း အသံတိတ်ဖြတ်မည်
            while (start < pcm.length && Math.abs(pcm[start]) < threshold) {
                start++;
            }
            // အဆုံးပိုင်း အသံတိတ်ဖြတ်မည်
            while (end > start && Math.abs(pcm[end]) < threshold) {
                end--;
            }

            let trimmedLen = end - start + 1;
            if (trimmedLen <= 0) return buffer;

            let trimmedBuffer = ctx.createBuffer(buffer.numberOfChannels, trimmedLen, buffer.sampleRate);
            for (let c = 0; c < buffer.numberOfChannels; c++) {
                let channelData = buffer.getChannelData(c);
                trimmedBuffer.getChannelData(c).set(channelData.subarray(start, end + 1));
            }
            return trimmedBuffer;
        }

        // ၄။ Fetch & Auto Trim Audio
        async function fetchAudioBuffer(filename, style) {
            let url = `${basePath}${style}/${filename}`;

            if (audioCache.has(url)) {
                return audioCache.get(url);
            }

            try {
                let res = await fetch(url);
                if (res.ok) {
                    let arrayBuffer = await res.arrayBuffer();
                    let rawBuffer = await ctx.decodeAudioData(arrayBuffer);
                    
                    // အသံတိတ်ပိုင်းများ ရှင်းထုတ်ခြင်း
                    let cleanedBuffer = trimSilence(rawBuffer);
                    
                    audioCache.set(url, cleanedBuffer);
                    return cleanedBuffer;
                }
            } catch (e) { }
            return null;
        }

        // ၅။ Playback Engine (Aggressive Continuous Overlap)
        async function playText() {
            let text = document.getElementById("text").value.trim();
            let style = document.getElementById("audioStyle").value;
            let status = document.getElementById("status");
            let btn = document.getElementById("playBtn");

            if (!text) return;

            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (ctx.state === "suspended") {
                await ctx.resume();
            }

            btn.disabled = true;

            let matchedWords = smartMatchSplit(text);
            
            let fetchPromises = matchedWords.map(w => {
                let fn = textToFilenameMap.get(w);
                return fn ? fetchAudioBuffer(fn, style) : Promise.resolve(null);
            });

            let buffers = (await Promise.all(fetchPromises)).filter(b => b !== null);

            if (buffers.length === 0) {
                status.innerText = "အသံမတွေ့ပါ";
                btn.disabled = false;
                return;
            }

            status.innerText = "ဖွင့်နေသည်...";

            let startTime = ctx.currentTime + 0.02;
            
            // ⚠️ မပြတ်စေရန် တိုးမြှင့်ထားသော Overlap တန်ဖိုး (0.18 စက္ကန့် = 180ms)
            // လိုအပ်ပါက 0.20 သို့မဟုတ် 0.22 ထိ စမ်းသပ်တိုးမြှင့်နိုင်ပါသည်
            const aggressiveOverlap = 0.18; 

            buffers.forEach((buffer, index) => {
                let source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);

                let playAt = (index === 0) ? startTime : startTime - aggressiveOverlap;
                source.start(playAt);

                startTime = playAt + buffer.duration;
            });

            let totalDurationMs = (startTime - ctx.currentTime) * 1000;
            setTimeout(() => {
                status.innerText = "အသင့်ဖြစ်ပါပြီ";
                btn.disabled = false;
            }, totalDurationMs);
        }

        window.addEventListener("DOMContentLoaded", initEngine);
    </script>

</body>

</html>
