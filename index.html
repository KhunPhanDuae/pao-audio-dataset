<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pa'O Smart Voice Engine (Ultra Fast)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 520px;
            margin: 20px auto;
            padding: 20px;
            background: #f4f6f9;
            text-align: center;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #0066ff;
            color: white;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            background: #004bb5;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Pa'O Smart Audio Reader</h2>

        <div class="form-group">
            <label for="text">စာသားော ရိုက်ထည့်ပါ:</label>
            <input type="text" id="text" placeholder="စာရိုက်ပါ (ဥပမာ - ခွဲးဟောဝ်ဒျာႏ မင်္ဂလာႏဒျာႏ)">
        </div>

        <div class="form-group">
            <label for="audioStyle">အသံ အမျိုးအစား ရွေးပါ:</label>
            <select id="audioStyle">
                <option value="conversational">ပုံမှန် စကားပြောသံ (Conversational)</option>
                <option value="storytelling">ပုံပြင် ပြောသံ (Storytelling)</option>
                <option value="news">သတင်း ဖတ်သံ (News)</option>
            </select>
        </div>

        <button id="playBtn" onclick="playText()">အသံဖတ်ရန်</button>

        <div id="status">အချက်အလက်များ ပြင်ဆင်နေသည်...</div>
    </div>

    <script>
        const basePath = "./audio/";
        
        // Fast Lookup Hash Map
        let textToFilenameMap = new Map();
        let sortedTranscripts = [];
        let audioCache = new Map();
        let ctx = null;

        // ၁။ CSV ဖတ်ပြီးသည်နှင့် O(1) Search ရအောင် Hash Indexing ချက်ချင်း ဆောက်မည်
        async function initEngine() {
            try {
                let res = await fetch("metadata.csv");
                if (res.ok) {
                    let text = await res.text();
                    let lines = text.split("\n");

                    for (let i = 1; i < lines.length; i++) {
                        let line = lines[i].trim();
                        if (!line) continue;
                        
                        let cols = line.split(",");
                        if (cols.length >= 2) {
                            let filename = cols[0].trim();
                            let transcript = cols[1].trim();

                            if (filename && transcript) {
                                textToFilenameMap.set(transcript, filename);
                                sortedTranscripts.push(transcript);
                            }
                        }
                    }
                    sortedTranscripts.sort((a, b) => b.length - a.length);
                    document.getElementById("status").innerText = "အသင့်ဖြစ်ပါပြီ";
                }
            } catch (e) {
                console.error("Metadata load error:", e);
                document.getElementById("status").innerText = "အသင့်ဖြစ်ပါပြီ";
            }
        }

        // ၂။ High-Speed Split Logic
        function fastSplit(text) {
            text = text.replace(/\s+/g, "");
            let result = [];

            while (text.length > 0) {
                // Direct Exact Match ပါက တိုက်ရိုက်ယူမည် (O(1))
                if (textToFilenameMap.has(text)) {
                    result.push(text);
                    break;
                }

                let found = "";
                for (let i = 0; i < sortedTranscripts.length; i++) {
                    let t = sortedTranscripts[i];
                    if (text.startsWith(t)) {
                        found = t;
                        break;
                    }
                }

                if (found) {
                    result.push(found);
                    text = text.substring(found.length);
                } else {
                    result.push(text[0]);
                    text = text.substring(1);
                }
            }
            return result;
        }

        // ၃။ Audio Fetching & Cache Management
        async function fetchAudioBuffer(filename, style) {
            let url = `${basePath}${style}/${filename}`;

            if (audioCache.has(url)) {
                return audioCache.get(url);
            }

            try {
                let res = await fetch(url);
                if (res.ok) {
                    let arrayBuffer = await res.arrayBuffer();
                    let decodedBuffer = await ctx.decodeAudioData(arrayBuffer);
                    audioCache.set(url, decodedBuffer);
                    return decodedBuffer;
                }
            } catch (e) { }
            return null;
        }

        // ၄။ Instant Sound Playback (Parallel Execution)
        async function playText() {
            let text = document.getElementById("text").value.trim();
            let style = document.getElementById("audioStyle").value;
            let status = document.getElementById("status");
            let btn = document.getElementById("playBtn");

            if (!text) return;

            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (ctx.state === "suspended") {
                await ctx.resume();
            }

            btn.disabled = true;

            let words = fastSplit(text);
            
            // Promise.all ဖြင့် အသံဖိုင်အားလုံးကို တစ်ပြိုင်နက်တည်း Parallel ဆွဲယူမည်
            let fetchPromises = words.map(w => {
                let fn = textToFilenameMap.get(w);
                return fn ? fetchAudioBuffer(fn, style) : Promise.resolve(null);
            });

            let buffers = (await Promise.all(fetchPromises)).filter(b => b !== null);

            if (buffers.length === 0) {
                status.innerText = "အသံမတွေ့ပါ";
                btn.disabled = false;
                return;
            }

            status.innerText = "ဖွင့်နေသည်...";

            let currentTime = ctx.currentTime;
            const overlap = 0.04; // Smooth crossfade (40ms)

            buffers.forEach((buffer, index) => {
                let source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);

                let startTime = (index === 0) ? currentTime : currentTime - overlap;
                source.start(startTime);
                currentTime = startTime + buffer.duration;
            });

            let totalTimeMs = (currentTime - ctx.currentTime) * 1000;
            setTimeout(() => {
                status.innerText = "အသင့်ဖြစ်ပါပြီ";
                btn.disabled = false;
            }, totalTimeMs);
        }

        window.addEventListener("DOMContentLoaded", initEngine);
    </script>

</body>

</html>
