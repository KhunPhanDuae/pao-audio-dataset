<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pa'O TTS Audio Search</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select, button { width: 100%; padding: 10px; margin-top: 5px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        audio { width: 100%; margin-top: 20px; }
        #status { margin-top: 10px; color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

    <h2>ပအိုဝ်ႏ TTS စာသားမှ အသံရှာဖွေစနစ်</h2>

    <div class="form-group">
        <label for="textInput">စာသား ရိုက်ထည့်ပါ:</label>
        <input type="text" id="textInput" placeholder="ဥပမာ - နီသွဉ်းသီးတွမ်ႏ ခမ်းသားလိုꩻအာယို">
    </div>

    <div class="form-group">
        <label for="audioStyle">အသံ အမျိုးအစား ရွေးချယ်ပါ:</label>
        <select id="audioStyle">
            <option value="conversational">ပုံမှန် စကားပြောသံ (Conversational)</option>
            <option value="storytelling">ပုံပြင် ပြောသံ (Storytelling)</option>
            <option value="news">သတင်း ဖတ်သံ (News)</option>
        </select>
    </div>

    <button id="searchPlayBtn">အသံ ရှာပြီး ဖွင့်မည်</button>
    <div id="status"></div>

    <audio id="ttsPlayer" controls>
        <source id="audioSource" src="" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
