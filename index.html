<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pa'O Smart Voice Engine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 520px;
            margin: 20px auto;
            padding: 20px;
            background: #f4f6f9;
            text-align: center;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #0066ff;
            color: white;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            background: #004bb5;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Pa'O Smart Audio Reader</h2>

        <div class="form-group">
            <label for="text">စာသား ရိုက်ထည့်ပါ:</label>
            <input type="text" id="text" placeholder="စာရိုက်ပါ (ဥပမာ - ခွဲးဟောဝ်ဒျာႏ မင်္ဂလာႏဒျာႏ နာꩻမဉ်ꩻတမုဲင်ꩻ)">
        </div>

        <div class="form-group">
            <label for="audioStyle">အသံ အမျိုးအစား ရွေးပါ:</label>
            <select id="audioStyle">
                <option value="conversational">ပုံမှန် စကားပြောသံ (Conversational)</option>
                <option value="storytelling">ပုံပြင် ပြောသံ (Storytelling)</option>
                <option value="news">သတင်း ဖတ်သံ (News)</option>
            </select>
        </div>

        <button id="playBtn" onclick="playText()">အသံဖတ်ရန်</button>

        <div id="status">အသင့်ဖြစ်ပါပြီ</div>
    </div>

    <script>
        const basePath = "./audio/";
        let metadataMap = new Map();
        let transcriptList = [];
        let audioCache = new Map();
        let ctx;

        // metadata.csv ကို ဖတ်ပြီး စာသား နှင့် ဖိုင်နာမည်ကို Map ချိတ်ဆက်ခြင်း
        async function loadMetadata() {
            try {
                let res = await fetch("metadata.csv");
                if (res.ok) {
                    let text = await res.text();
                    let lines = text.split("\n");

                    for (let i = 1; i < lines.length; i++) {
                        let cols = lines[i].split(",");
                        if (cols.length >= 2) {
                            let filename = cols[0].trim();
                            let transcript = cols[1].trim();

                            if (filename && transcript) {
                                metadataMap.set(transcript, filename);
                                transcriptList.push(transcript);
                            }
                        }
                    }

                    transcriptList.sort((a, b) => b.length - a.length);
                }
            } catch (e) {
                console.error("metadata.csv ဖတ်မရပါ:", e);
            }
        }

        window.addEventListener("DOMContentLoaded", loadMetadata);

        // Space များကို ရှင်းထုတ်ပြီး Smart Split ပြုလုပ်ခြင်း
        function cleanAndSplit(text) {
            let cleanedText = text.replace(/\s+/g, ''); // Space အားလုံးကို ဖယ်ထုတ်ခြင်း
            let result = [];
            
            while (cleanedText.length > 0) {
                let found = "";
                for (let t of transcriptList) {
                    if (cleanedText.startsWith(t)) {
                        found = t;
                        break;
                    }
                }

                if (found) {
                    result.push(found);
                    cleanedText = cleanedText.substring(found.length);
                } else {
                    let char = cleanedText[0];
                    result.push(char);
                    cleanedText = cleanedText.substring(1);
                }
            }
            return result;
        }

        // Web Audio Buffer ကို Load လုပ်ခြင်း
        async function loadAudioBuffer(filename, style) {
            let url = `${basePath}${style}/${filename}`;

            if (audioCache.has(url)) {
                return audioCache.get(url);
            }

            try {
                let res = await fetch(url);
                if (res.ok) {
                    let arrayBuffer = await res.arrayBuffer();
                    let decodedBuffer = await ctx.decodeAudioData(arrayBuffer);
                    audioCache.set(url, decodedBuffer);
                    return decodedBuffer;
                }
            } catch (e) { }
            return null;
        }

        // Overlapping Audio Engine (အသံ အထပ်အဆက် သဘာဝကျကျ ဖွင့်ပေးသည့် စနစ်)
        async function playText() {
            let text = document.getElementById("text").value.trim();
            let style = document.getElementById("audioStyle").value;
            let status = document.getElementById("status");
            let btn = document.getElementById("playBtn");

            if (!text) return;

            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (ctx.state === "suspended") {
                await ctx.resume();
            }

            btn.disabled = true;
            status.innerText = "အသံဖိုင်များ စီစဉ်နေသည်...";

            let matchedTranscripts = cleanAndSplit(text);
            let buffers = [];

            for (let tr of matchedTranscripts) {
                let filename = metadataMap.get(tr);
                if (filename) {
                    let buffer = await loadAudioBuffer(filename, style);
                    if (buffer) {
                        buffers.push(buffer);
                    }
                }
            }

            if (buffers.length === 0) {
                status.innerText = "အသံမတွေ့ပါ";
                btn.disabled = false;
                return;
            }

            status.innerText = "ဖွင့်နေသည်...";

            let currentTime = ctx.currentTime;
            
            // 💡 အသံ ၂ ခုကြား ထပ်ပေးမည့် အချိန် (OVERLAP TIME - 0.08 စက္ကန့်)
            // ဒီတန်ဖိုးကို လိုအပ်သလို (0.05 မှ 0.1) အထိ ပြင်ဆင်နိုင်ပါတယ်
            const OVERLAP_TIME = 0.08; 

            buffers.forEach((buffer, index) => {
                let source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);
                source.start(currentTime);

                // အသံတစ်ခု မပြီးမီ 0.08 စက္ကန့် စော၍ နောက်အသံကို ဆက်ဖွင့်ခြင်း
                if (index < buffers.length - 1) {
                    currentTime += Math.max(0, buffer.duration - OVERLAP_TIME);
                } else {
                    currentTime += buffer.duration;
                }
            });

            let totalTimeMs = (currentTime - ctx.currentTime) * 1000;
            setTimeout(() => {
                status.innerText = "အသင့်ဖြစ်ပါပြီ";
                btn.disabled = false;
            }, totalTimeMs);
        }
    </script>

</body>

</html>
