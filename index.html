<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pa'O TTS Audio Player</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        audio {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>ပအိုဝ်ႏ TTS အငေါဝ်းထေင်ႏ</h2>

    <div class="form-group">
        <label for="audioFile">အသံဖိုင် (စာသား):</label>
        <select id="audioFile">
            <option value="pao_audio_0047.wav">pao_audio_0047.wav - နီသွဉ်းသီးတွမ်ႏ ခမ်းသားလိုꩻအာယို</option>
        </select>
    </div>

    <div class="form-group">
        <label for="audioStyle">အသံ အမျိုးအစား ရွေးချယ်ပါ:</label>
        <select id="audioStyle">
            <option value="conversational">ပုံမှန် စကားပြောသံ (Conversational)</option>
            <option value="storytelling">ပုံပြင် ပြောသံ (Storytelling)</option>
            <option value="news">သတင်း ဖတ်သံ (News)</option>
        </select>
    </div>

    <button id="playBtn">အသံ နားထောင်မည်</button>

    <audio id="ttsPlayer" controls>
        <source id="audioSource" src="" type="audio/wav">
        Browser မှ အသံဖွင့်ခြင်းကို မထောက်ပံ့ပါ။
    </audio>

    <script src="script.js"></script>
</body>
</html>
